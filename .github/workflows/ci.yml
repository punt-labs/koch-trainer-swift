name: CI
# Caching: Homebrew packages (versioned) + DerivedData (source-hashed)
# Unit tests run on all PRs and main pushes
# UI tests run on main pushes only (typically 35–40 min on GitHub runners; 45 min timeout)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get tool versions
        id: tool-versions
        run: |
          echo "xcodegen=$(brew info xcodegen --json=v2 | jq -r '.formulae[0].versions.stable')" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Homebrew packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            /opt/homebrew/Cellar/xcodegen
          key: brew-${{ runner.os }}-${{ runner.arch }}-xcodegen-${{ steps.tool-versions.outputs.xcodegen }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-xcodegen-

      - name: Install XcodeGen
        run: brew list xcodegen &>/dev/null && brew link --overwrite xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deriveddata
          key: deriveddata-${{ runner.os }}-xcode-${{ steps.tool-versions.outputs.xcode }}-${{ hashFiles('**/*.swift', 'project.yml') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode-${{ steps.tool-versions.outputs.xcode }}-

      - name: List Available Simulators
        run: xcrun simctl list devices available | grep iPhone | head -10

      - name: Build
        run: |
          xcodebuild build \
            -scheme KochTrainer \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,arch=arm64' \
            -derivedDataPath .deriveddata \
            -quiet

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -scheme KochTrainer \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,arch=arm64' \
            -derivedDataPath .deriveddata \
            -only-testing:KochTrainerTests \
            -resultBundlePath TestResults.xcresult \
            | xcpretty --color --report junit

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-results
          path: TestResults.xcresult

  ui-tests:
    name: UI Tests
    runs-on: macos-15
    timeout-minutes: 45
    # Only run on pushes to main (not on PRs — too slow for PR feedback)
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get tool versions
        id: tool-versions
        run: |
          echo "xcodegen=$(brew info xcodegen --json=v2 | jq -r '.formulae[0].versions.stable')" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Homebrew packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            /opt/homebrew/Cellar/xcodegen
          key: brew-${{ runner.os }}-${{ runner.arch }}-xcodegen-${{ steps.tool-versions.outputs.xcodegen }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-xcodegen-

      - name: Install XcodeGen
        run: brew list xcodegen &>/dev/null && brew link --overwrite xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deriveddata
          key: deriveddata-${{ runner.os }}-xcode-${{ steps.tool-versions.outputs.xcode }}-${{ hashFiles('**/*.swift', 'project.yml') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-xcode-${{ steps.tool-versions.outputs.xcode }}-

      - name: List Available Simulators
        run: xcrun simctl list devices available | grep iPhone | head -10

      - name: Build
        run: |
          xcodebuild build \
            -scheme KochTrainer \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,arch=arm64' \
            -derivedDataPath .deriveddata \
            -quiet

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -scheme KochTrainer \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,arch=arm64' \
            -derivedDataPath .deriveddata \
            -only-testing:KochTrainerUITests \
            -resultBundlePath UITestResults.xcresult \
            | xcpretty --color --report junit

      - name: Upload UI Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-test-results
          path: UITestResults.xcresult

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Get SwiftLint version
        id: swiftlint-version
        run: |
          version=$(brew info swiftlint --json=v2 | jq -r '.formulae[0].versions.stable')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Homebrew packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            /opt/homebrew/Cellar/swiftlint
          key: brew-${{ runner.os }}-${{ runner.arch }}-swiftlint-${{ steps.swiftlint-version.outputs.version }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-swiftlint-

      - name: Install SwiftLint
        run: brew list swiftlint &>/dev/null && brew link --overwrite swiftlint || brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
